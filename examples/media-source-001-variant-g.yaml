    supplied_descriptions:
      - text: "Robert Cornelius's daguerreotype self-portrait from October or November, 1839--the earliest extant American portrait photograph--is among the treasures of the Library of Congress's photographic collections. Made within just months of Louis-Jacques-Mande Daguerre's August 1839 announcement of his process to the world, the Cornelius photo showed that the new medium had the potential to record a human likeness, theretofore considered highly impractical due to the long exposure times required. Daguerre announced his invention of a photographic method to the French Academy of Sciences in August 1839. That October, a young Philadelphian, Robert Cornelius, working out of doors to take advantage of the light, made this head-and-shoulders self-portrait using a box fitted with a lens from an opera glass. In the portrait, Cornelius stands slightly off-center with hair askew, in the yard behind his family's lamp and chandelier store, peering uncertainly into the camera. Early daguerreotypy required a long exposure time, ranging from three to fifteen minutes, making the process nearly impractical for portraiture."
