metarci:
  name: MetaRCI Base Schema
  version: "0.1.0"
  status: active

  description: >
    A domain-agnostic metadata model organized into Reference,
    Context, and Interpretive tiers. The base schema defines a
    reusable set of fields that can be selected, overridden, or
    extended through implementation profiles.

  principles:
    - Metadata should preserve source identity and provenance.
    - Mechanically extracted metadata should remain distinguishable
      from curated contextual metadata.
    - Interpretive metadata should be explicit rather than inferred
      invisibly at retrieval time.
    - Fields may remain null when information is unavailable,
      inapplicable, or not yet curated.
    - Profiles may refine requirements without modifying the base model.

  tiers:
    reference:
      name: Reference Tier

      description: >
        Source-level metadata that can usually be extracted or generated
        mechanically during ingestion with minimal human interpretation.

      fields:
        source_id:
          type: string
          requirement: required
          nullable: false
          description: >
            Stable identifier assigned to the source record.

        original_filename:
          type: string
          requirement: recommended
          nullable: true
          description: >
            Original filename of the ingested source.

        source_uri:
          type: string
          requirement: conditional
          nullable: true
          description: >
            Source location, URL, repository path, or other retrievable URI.

        file_format:
          type: string
          requirement: recommended
          nullable: true
          description: >
            File-format designation such as pdf, docx, txt, xml, or html.

        mime_type:
          type: string
          requirement: recommended
          nullable: true
          description: >
            MIME type associated with the source file.

        file_size_bytes:
          type: integer
          requirement: conditional
          nullable: true
          description: >
            Source file size expressed in bytes.

        checksum:
          type: string
          requirement: recommended
          nullable: true
          description: >
            Checksum or cryptographic digest used to identify the exact
            source file and detect changes.

        page_count:
          type: integer
          requirement: conditional
          nullable: true
          description: >
            Number of pages detected in a paginated source.

        creation_date:
          type: date
          requirement: conditional
          nullable: true
          description: >
            Creation date extracted from the source or its file metadata.

        modification_date:
          type: date
          requirement: conditional
          nullable: true
          description: >
            Most recent modification date extracted from the source or
            its file metadata.

        review_date:
          type: date
          requirement: conditional
          nullable: true
          description: >
            Date on which the source states that it was reviewed,
            verified, or approved.

        stated_title:
          type: string
          requirement: conditional
          nullable: true
          description: >
            Title stated within the source itself.

        stated_author:
          type: string
          requirement: conditional
          nullable: true
          description: >
            Author or creator stated within the source itself.

        stated_version:
          type: string
          requirement: conditional
          nullable: true
          description: >
            Version designation stated within the source itself.

        ingestion_timestamp:
          type: datetime
          requirement: required
          nullable: false
          description: >
            Date and time at which the source was processed by the
            ingestion workflow.

        parser_name:
          type: string
          requirement: recommended
          nullable: true
          description: >
            Name of the parser or extraction component used during
            ingestion.

        parser_version:
          type: string
          requirement: conditional
          nullable: true
          description: >
            Version of the parser or extraction component used during
            ingestion.

        extraction_status:
          type: string
          requirement: required
          nullable: false
          allowed_values:
            - success
            - partial
            - failed
            - skipped
          description: >
            Outcome of the source extraction process.

    context:
      name: Context Tier

      description: >
        Curated or externally supplied metadata that situates the source
        within a corpus, organization, discipline, jurisdiction, period,
        audience, or operational setting.

      fields:
        preferred_title:
          type: string
          requirement: conditional
          nullable: true
          description: >
            Curated title preferred for display, retrieval, or citation.

        alternate_titles:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            Alternate, historical, abbreviated, translated, or commonly
            used titles associated with the source.

        domains:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            Broad subject, professional, academic, or operational domains
            associated with the source.

        categories:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            Curated classifications assigned within the implementation
            or corpus.

        origin_date:
          type: date
          requirement: conditional
          nullable: true
          description: >
            Curated date associated with the source's creation,
            composition, publication, issuance, or original release.

        period_covered:
          type: string
          requirement: conditional
          nullable: true
          description: >
            Time period addressed, represented, or governed by the source.

        related_sources:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            Identifiers or references for sources related to this record.

        source_lineage:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            Known predecessor, successor, derivative, translated, revised,
            or superseding sources.

        responsible_organizations:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            Organizations responsible for creating, issuing, maintaining,
            governing, or reviewing the source.

        organizational_context:
          type: string
          requirement: conditional
          nullable: true
          description: >
            Program, department, initiative, repository, or institutional
            setting associated with the source.

        geographic_context:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            Geographic places, regions, or territories associated with
            the source.

        jurisdictional_context:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            Legal, regulatory, administrative, or policy jurisdictions
            relevant to the source.

        intended_audiences:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            Audiences for whom the source was created or maintained.

        intended_purpose:
          type: string
          requirement: conditional
          nullable: true
          description: >
            Curated statement of the source's intended function or use.

        sensitivity:
          type: object
          requirement: conditional
          nullable: true
          description: >
            Sensitivity classification and its basis for this source.

          properties:
            level:
              type: string
              requirement: recommended
              nullable: true
              description: >
                General sensitivity level assigned to the source.

            categories:
              type: list
              item_type: string
              requirement: conditional
              nullable: true
              description: >
                Specific sensitivity categories associated with the source.

            basis:
              type: string
              requirement: conditional
              nullable: true
              description: >
                Explanation, policy, authority, or profile supporting the
                sensitivity assignment.

        rights_status:
          type: string
          requirement: conditional
          nullable: true
          description: >
            Externally established copyright, licensing, public-domain,
            or other rights status governing use of the source.

        external_identifiers:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            Identifiers assigned by external catalogs, repositories,
            registries, standards, or information systems.

    interpretive:
      name: Interpretive Tier

      description: >
        Higher-order metadata added for a particular corpus, analytical
        purpose, retrieval strategy, governance need, or implementation
        context.

      fields:
        concepts:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            Concepts represented, discussed, or operationalized by the source.

        themes:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            Recurring themes or broad interpretive concerns associated
            with the source.

        entities:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            People, organizations, places, systems, works, events, or other
            named entities relevant to the implementation.

        analytical_categories:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            Corpus-specific analytical classifications assigned to the source.

        relationships:
          type: list
          item_type: object
          requirement: conditional
          nullable: true
          description: >
            Declared relationships between this source and other sources,
            entities, concepts, or records.

          item_properties:
            target_id:
              type: string
              requirement: required
              nullable: false
              description: >
                Identifier of the relationship target.

            relationship_type:
              type: string
              requirement: required
              nullable: false
              description: >
                Nature of the relationship between the source and the target.

            notes:
              type: string
              requirement: conditional
              nullable: true
              description: >
                Additional explanation or qualification of the relationship.

        interpretive_notes:
          type: list
          item_type: string
          requirement: conditional
          nullable: true
          description: >
            Human-authored analytical observations that do not fit a more
            structured field.

        corpus_role:
          type: string
          requirement: conditional
          nullable: true
          description: >
            Role played by the source within the implementation corpus.

        extensions:
          type: object
          requirement: conditional
          nullable: true
          description: >
            Implementation-specific interpretive metadata that is not yet
            represented by a formal base-schema or profile field.

