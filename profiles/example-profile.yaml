metarci_profile:
  name: example-profile
  version: "0.1.0"
  status: draft
  extends: ../schemas/metarci-base.yaml

  description: >
    Example MetaRCI profile demonstrating how an implementation
    can select, require, and extend fields from the base schema.

  implementation:
    domain: null
    corpus: null
    use_case: null

  tier_overrides:
    reference:
      review_date:
        requirement: recommended

    context:
      sensitivity:
        requirement: recommended

    interpretive: {}

  custom_fields:
    reference: {}

    context:
      business_unit:
        type: string
        requirement: conditional
        nullable: true
        description: >
          Business unit associated with the source.

    interpretive:
      decision_context:
        type: string
        requirement: conditional
        nullable: true
        description: >
          Corpus-specific description of how the source informs
          a decision, action, or analytical use case.