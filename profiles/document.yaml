metarci_profile:
  name: document
  version: "0.1.0"
  status: active
  extends: ../schemas/metarci-base.yaml
  base_version: "0.1.0"

  description: >
    Structural profile for bounded textual or predominantly textual
    source artifacts. It specializes document identity and intrinsic
    source-grounded structure without introducing domain semantics.

  implementation:
    domain: null
    corpus: null
    use_case: null

  tier_overrides:
    reference:
      page_count:
        requirement: recommended
      stated_title:
        requirement: recommended
      stated_author:
        requirement: recommended

    context: {}

    interpretive: {}

  custom_fields:
    reference:
      document_subdivisions:
        type: list
        item_type: object
        requirement: conditional
        nullable: true
        description: >
          Optional descriptors for intrinsic source-native document
          subdivisions such as parts, chapters, sections, clauses,
          appendices, or comparable structural divisions.
        item_properties:
          kind:
            type: string
            requirement: required
            nullable: false
            description: Source-grounded subdivision type label.

          label:
            type: string
            requirement: required
            nullable: false
            description: Human-readable subdivision label as represented by the source.

          source_locator:
            type: string
            requirement: conditional
            nullable: true
            description: Source-specific locator identifying the subdivision.

    context: {}

    interpretive: {}