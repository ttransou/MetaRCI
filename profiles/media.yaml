metarci_profile:
  name: media
  version: "0.1.0"
  status: active
  extends: ../schemas/metarci-base.yaml
  base_version: "0.1.0"

  description: >
    Structural profile for non-textual and multimodal source artifacts
    such as photographs, diagrams, audio, video, and scanned artwork.
    This initial version establishes the media profile boundary before
    any override refinements are introduced.

  implementation:
    domain: null
    corpus: null
    use_case: null

  tier_overrides:
    reference: {}
    context: {}
    interpretive: {}

  custom_fields:
    reference:
      visual_dimensions:
        type: object
        requirement: conditional
        nullable: true
        description: >
          Mechanically recoverable pixel dimensions of visual media.
        properties:
          width_pixels:
            type: integer
            requirement: required
            nullable: false
            description: >
              Width of the visual source in pixels.

          height_pixels:
            type: integer
            requirement: required
            nullable: false
            description: >
              Height of the visual source in pixels.

      duration_milliseconds:
        type: integer
        requirement: conditional
        nullable: true
        description: >
          Mechanically recoverable duration of temporal media in milliseconds.

      stream_types:
        type: list
        item_type: string
        requirement: conditional
        nullable: true
        description: >
          Mechanically recoverable media stream types present in the source.

      video_codec:
        type: string
        requirement: conditional
        nullable: true
        description: >
          Mechanically recoverable codec identifier for a video stream.

      audio_codec:
        type: string
        requirement: conditional
        nullable: true
        description: >
          Mechanically recoverable codec identifier for an audio stream.

    context:
      supplied_descriptions:
        type: list
        item_type: object
        requirement: conditional
        nullable: true
        description: >
          Descriptive text supplied by an external source rather than
          inferred from the media signal itself.
        item_properties:
          text:
            type: string
            requirement: required
            nullable: false
            description: >
              Externally supplied descriptive text associated with the
              media source.

          source_id:
            type: string
            requirement: required
            nullable: false
            description: >
              Identifier for the external source that supplied the
              description.

      supplied_attributions:
        type: list
        item_type: object
        requirement: conditional
        nullable: true
        description: >
          Creator or contributor attribution supplied by an external
          source rather than mechanically recovered from the media source
          itself.
        item_properties:
          name:
            type: string
            requirement: required
            nullable: false
            description: >
              Name of the person, organization, or other named agent
              attributed by the external source.

          source_id:
            type: string
            requirement: required
            nullable: false
            description: >
              Identifier for the external source that supplied the
              attribution.

      supplied_terms:
        type: list
        item_type: object
        requirement: conditional
        nullable: true
        description: >
          Descriptive or classificatory terms supplied by an external
          source rather than inferred from the media signal itself.
        item_properties:
          term:
            type: string
            requirement: required
            nullable: false
            description: >
              Externally supplied descriptive or classificatory term
              associated with the media source.

          source_id:
            type: string
            requirement: required
            nullable: false
            description: >
              Identifier for the external source that supplied the term.

    interpretive:
      generated_descriptions:
        type: list
        item_type: object
        requirement: conditional
        nullable: true
        description: >
          Descriptive text produced by a model, algorithm, analytical
          workflow, or other interpretive process applied to the media
          source.
        item_properties:
          text:
            type: string
            requirement: required
            nullable: false
            description: >
              Generated descriptive text associated with the media source.

          generator:
            type: string
            requirement: required
            nullable: false
            description: >
              Identifier or name for the model, tool, analytical process,
              or other mechanism that produced the description.

      generated_terms:
        type: list
        item_type: object
        requirement: conditional
        nullable: true
        description: >
          Descriptive or classificatory terms produced by a model,
          algorithm, analytical workflow, or other interpretive process
          applied to the media source.
        item_properties:
          term:
            type: string
            requirement: required
            nullable: false
            description: >
              Generated descriptive or classificatory term associated
              with the media source.

          generator:
            type: string
            requirement: required
            nullable: false
            description: >
              Identifier or name for the model, tool, analytical process,
              or other mechanism that produced the term.

      temporal_segments:
        type: list
        item_type: object
        requirement: conditional
        nullable: true
        description: >
          Time-bounded segments used to locate portions of temporal media.
        item_properties:
          segment_id:
            type: string
            requirement: required
            nullable: false
            description: >
              Stable identifier for the temporal segment within the source.

          start_milliseconds:
            type: integer
            requirement: required
            nullable: false
            description: >
              Start position of the segment measured in milliseconds
              from the beginning of the media source.

          end_milliseconds:
            type: integer
            requirement: required
            nullable: false
            description: >
              End position of the segment measured in milliseconds
              from the beginning of the media source.