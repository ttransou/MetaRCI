metarci_profile:
  name: composite
  version: "0.1.0"
  status: draft
  extends: ../schemas/metarci-base.yaml
  base_version: "0.1.0"

  description: >
    Structural profile for logical source units whose independently
    meaningful components may require different structural treatment
    while remaining parts of a single coherent parent source. This
    version evaluates whole-part identity, containment, ordering, and
    component relationships while introducing only evidence-supported
    composite-specific fields.

  implementation:
    domain: null
    corpus: null
    use_case: null

  tier_overrides:
    reference: {}
    context: {}
    interpretive: {}

  custom_fields:
    reference:
      components:
        type: list
        item_type: object
        requirement: conditional
        nullable: true
        description: >
          Source-declared meaningful components of a Composite source,
          including mechanically recoverable whole-part relationships
          such as membership, containment, and ordering.
        item_properties:
          component_id:
            type: string
            requirement: required
            nullable: false
            description: >
              Source-grounded identifier for the meaningful component.

          relationship_type:
            type: string
            requirement: required
            nullable: false
            description: >
              Source-declared relationship between the Composite parent
              and the component.

          order:
            type: integer
            requirement: optional
            nullable: true
            description: >
              Source-declared component order when sequence is intrinsic
              to the source.

    context: {}
    interpretive: {}